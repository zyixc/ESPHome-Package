platform: homeassistant
id: ${hass_sensor_id}
entity_id: sensor.${hass_sensor_id}
on_value:
- lvgl.label.update:
    id: lvgl_value_label_${hass_sensor_id}
    text: !lambda |-
      char buffer[10];
      snprintf(buffer, sizeof(buffer), "%.0f", x);
      return buffer;
    text_color: &color !lambda |-
      lv_color_t color = lv_color_hex(0xffffff);
      if (x > 20.0) {
        color = lv_color_hex(0x7cfc00);
      } else {
        color = lv_color_hex(0xff0000);
      }
      return color;
- lvgl.label.update:
    id: lvgl_value_unit_${hass_sensor_id}
    text_color: *color
- lvgl.label.update:
    id: lvgl_value_icon_${hass_sensor_id}
    text: !lambda |-
      char buffer[10];
      std::string icon;
      if (x == 100.0) {
        icon = "\U000F0079"; // mdi-battery (full)
      } else if (x > 90) {
        icon = "\U000F0082"; // mdi-battery-90
      } else if (x > 80) {
        icon = "\U000F0081"; // mdi-battery-80
      } else if (x > 70) {
        icon = "\U000F0080"; // mdi-battery-70
      } else if (x > 60) {
        icon = "\U000F007F"; // mdi-battery-60
      } else if (x > 50) {
        icon = "\U000F007E"; // mdi-battery-50
      } else if (x > 40) {
        icon = "\U000F007D"; // mdi-battery-40
      } else if (x > 30) {
        icon = "\U000F007C"; // mdi-battery-30
      } else if (x > 20) {
        icon = "\U000F007B"; // mdi-battery-20
      } else if (x > 10) {
        icon = "\U000F007A"; // mdi-battery-10
      } else if (x > 0) {
        icon = "\U000F008E"; // mdi-battery-outline
      } else {
        icon = "\U000F0091"; // mdi-battery-unknown
      }
      snprintf(buffer, sizeof(buffer), "%s", icon.c_str());
      return buffer;
- lvgl.obj.update:
    id: lvgl_value_icon_bg_${hass_sensor_id}
    bg_color: *color